plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.prs'
version = '1.0'

repositories {
    mavenCentral()
}
application {
    mainClass = 'prs.inmemory.Main'
}
//This is to tell what will be the main file of jar
jar {
    manifest {
        attributes(
                'Main-Class': application.mainClass.get()
        )
    }
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
shadowJar {

    archiveBaseName.set('db')    // <- your desired base name
    archiveVersion.set('1.0')               // <- remove version from filename
    archiveClassifier.set('')             // <- remove "-all" from filename
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.12'
    implementation 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'ch.qos.logback:logback-core:1.4.14'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}